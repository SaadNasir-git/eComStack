services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_PASSWORD=password
      - POSTGRES_USER=postgres
      - POSTGRES_DB=codeinease
    ports:
      - 5432:5432
    volumes:
      - db_data:/var/lib/postgresql
  
